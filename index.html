<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO E META TAGS -->
    <title>Marte Alma | Cultura e Entretenimento Pop</title>
    <meta name="description" content="MARTE ALMA é um site sobre cultura pop. Acompanhe notícias, fotos, vídeos, performances e estreias do seu ídolo pop favorito.">
    <meta name="keywords" content="cultura pop, notícias pop, celebridades, estreias, vídeos musicais, performances, entretenimento, música, cinema, séries, marte alma">
    <meta property="og:title" content="Marte Alma | Cultura e Entretenimento Pop">
    <meta property="og:description" content="Acompanhe as últimas notícias, fotos, vídeos e estreias do seu ídolo pop favorito no Marte Alma.">
    <meta property="og:type" content="website">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'], 
                        serif: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: { pink: '#ec4899', orange: '#f97316', cyan: '#06b6d4', dark: '#0a0a0f' }
                    }
                }
            }
        }
    </script>

    <style>
        :root { --bg-color: #f8fafc; --text-color: #0f172a; --glass-bg: rgba(255, 255, 255, 0.45); }
        .dark { --bg-color: #050508; --text-color: #f8fafc; --glass-bg: rgba(15, 15, 22, 0.55); }
        body { background-color: var(--bg-color); color: var(--text-color); transition: background-color 0.4s ease; }

        .liquid-glass {
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .img-gradient {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
        }
    </style>
</head>

<body class="antialiased font-sans">
    
    <!-- CABEÇALHO -->
    <header class="fixed top-0 left-0 right-0 z-50 liquid-glass py-4 px-6 md:px-12 flex justify-between items-center border-b border-white/10">
        <div class="flex items-center gap-4">
            <button onclick="toggleSidebar()" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10"><i class="ph ph-list text-2xl"></i></button>
            <a href="#" onclick="renderHome()" class="font-serif text-2xl font-black">MARTE<span class="text-brand-pink">ALMA</span></a>
        </div>

        <nav class="hidden md:flex gap-8 font-bold text-sm tracking-widest uppercase opacity-70">
            <a href="#" onclick="filterCategory('Pop')" class="hover:text-brand-pink transition">Pop</a>
            <a href="#" onclick="filterCategory('Cinema')" class="hover:text-brand-cyan transition">Cinema</a>
            <a href="#" onclick="filterCategory('Séries')" class="hover:text-brand-orange transition">Séries</a>
        </nav>

        <button onclick="toggleTheme()" class="w-10 h-10 rounded-full flex items-center justify-center bg-black/5 dark:bg-white/10"><i class="ph-fill ph-sun dark:ph-moon text-xl"></i></button>
    </header>

    <!-- SIDEBAR -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white/95 dark:bg-black/95 backdrop-blur-xl border-r border-white/20 transform -translate-x-full transition-transform duration-300 p-8">
        <button onclick="toggleSidebar()" class="mb-8"><i class="ph ph-x text-2xl"></i></button>
        <nav class="flex flex-col gap-6 font-bold uppercase text-lg">
            <a href="#" onclick="filterCategory('Pop'); toggleSidebar();">Pop</a>
            <a href="#" onclick="filterCategory('Cinema'); toggleSidebar();">Cinema</a>
            <a href="#" onclick="filterCategory('Séries'); toggleSidebar();">Séries</a>
        </nav>
    </div>

    <main class="pt-32 pb-20 px-6 max-w-7xl mx-auto">
        <div id="dynamic-content">
            <!-- Conteúdo carregado dinamicamente -->
        </div>
    </main>

    <script>
        const POSTS = [
            { id: 1, title: "O NOVO SOM DE LADY GAGA", category: "Pop", image: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800", content: "A rainha do pop está de volta com um som revolucionário..." },
            { id: 2, title: "DUNA 3: O FINAL", category: "Cinema", image: "https://images.unsplash.com/photo-1542451313056-b7c8e626645f?w=800", content: "Uma análise profunda sobre o fim da trilogia que mudou o cinema." },
            { id: 3, title: "SÉRIE DO ANO: O QUE ESPERAR", category: "Séries", image: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800", content: "Os bastidores da produção que parou o streaming." }
        ];

        function toggleTheme() { document.documentElement.classList.toggle('dark'); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }

        function renderHome() {
            let html = '<div class="grid md:grid-cols-2 gap-8">';
            POSTS.forEach((post, i) => {
                const colors = ['bg-brand-pink', 'bg-brand-cyan', 'bg-brand-orange'];
                const color = colors[i % colors.length];
                html += `
                    <div class="relative group cursor-pointer" onclick="renderArticle(${post.id})">
                        <div class="absolute inset-0 rounded-3xl translate-x-4 translate-y-4 ${color} opacity-40 group-hover:translate-x-2 group-hover:translate-y-2 transition-transform duration-300"></div>
                        <div class="relative overflow-hidden rounded-3xl h-[400px]">
                            <img src="${post.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                            <div class="absolute inset-0 img-gradient p-8 flex flex-col justify-end">
                                <span class="text-xs font-bold uppercase tracking-widest text-white/80 mb-2">${post.category}</span>
                                <h2 class="text-white text-3xl font-black uppercase leading-tight">${post.title}</h2>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            document.getElementById('dynamic-content').innerHTML = html;
        }

        function renderArticle(id) {
            const post = POSTS.find(p => p.id === id);
            document.getElementById('dynamic-content').innerHTML = `
                <div class="max-w-3xl mx-auto liquid-glass p-8 md:p-16 rounded-3xl animate-in fade-in zoom-in duration-500">
                    <button onclick="renderHome()" class="mb-8 font-bold flex items-center gap-2 hover:opacity-60"><i class="ph ph-arrow-left"></i> VOLTAR</button>
                    <h1 class="text-5xl font-black uppercase mb-8">${post.title}</h1>
                    <div class="prose dark:prose-invert max-w-none">
                        <p class="text-xl leading-relaxed opacity-80">${post.content}</p>
                    </div>
                </div>
            `;
        }

        function filterCategory(cat) {
            document.getElementById('dynamic-content').innerHTML = `<h1 class="text-4xl font-black mb-12 uppercase opacity-80">CATEGORIA: ${cat}</h1><div class="text-center p-20">Em breve, notícias em ${cat}...</div>`;
        }

        renderHome();
    </script>
</body>
</html>
